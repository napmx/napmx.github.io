<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>nap mx 공식 연동 가이드</title>
  <meta name="description" content="nap mx 공식 연동 가이드">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="/_media/favicon.ico">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* =============================================
       nap mx Design System — Dark Sidebar Theme
       Primary : #E8001A  |  Sidebar BG : #18191c
    ============================================= */

    /* ── 기본 리셋 & 변수 ── */
    :root {
        --red: #E8001A;
        --red-mid: #c5001a;
        --red-light: rgba(232,0,26,.08);
        --dark: #1a1a1a;
        --sidebar-bg: #18191c;
        --sidebar-hover: #2a2b2e;
        --sidebar-border: #2d2e31;
        --text: #374151;
        --light: #6b7280;
        --border: #e8eaed;
        --bg: #f7f8fa;
        /* Docsify 테마 색 덮어쓰기 */
        --theme-color: #E8001A;
    }

    /* ── 전체 배경 ── */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Malgun Gothic', sans-serif; }

    /* ── 상단 네비바 (Docsify nav.app-nav) ── */
    nav.app-nav {
        background: var(--sidebar-bg) !important;
        border-bottom: 1px solid var(--sidebar-border) !important;
        padding: 0 20px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
    }
    nav.app-nav a {
        color: #9a9ba0 !important;
        font-size: 13px;
        font-weight: 600;
    }
    nav.app-nav a:hover,
    nav.app-nav a.active {
        color: #fff !important;
        text-decoration: none;
    }
    nav.app-nav li ul {
        background: #1e1f23;
        border: 1px solid var(--sidebar-border);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
        padding: 6px 0;
    }
    nav.app-nav li ul li a {
        padding: 7px 16px;
        font-size: 12.5px;
        color: #9a9ba0 !important;
    }
    nav.app-nav li ul li a:hover {
        background: var(--sidebar-hover);
        color: #fff !important;
    }

    /* ── 사이드바 ── */
    .sidebar {
        background-color: var(--sidebar-bg) !important;
        border-right: 1px solid var(--sidebar-border) !important;
        padding-top: 0;
    }

    /* 앱 이름 (로고 영역) */
    .sidebar .app-name {
        background: var(--sidebar-bg);
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--sidebar-border);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -1px;
        line-height: 1;
    }
    .sidebar .app-name a {
        color: #fff !important;
    }
    .sidebar .app-name a b {
        color: var(--red);
    }

    /* 사이드바 검색창 */
    .search {
        background: var(--sidebar-bg);
        border-bottom: 1px solid var(--sidebar-border);
        padding: 8px 12px;
    }
    .search input {
        background: #222326 !important;
        border: 1px solid #3a3b3e !important;
        border-radius: 6px !important;
        color: #ccc !important;
        font-size: 12px !important;
        padding: 7px 10px !important;
    }
    .search input:focus {
        border-color: #555 !important;
        color: #fff !important;
        outline: none !important;
        box-shadow: none !important;
    }
    .search input::placeholder { color: #555 !important; }
    .search .results-panel {
        background: #1e1f23;
        border: 1px solid var(--sidebar-border);
        border-radius: 0 0 8px 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .search .results-panel a {
        color: #ccc !important;
        border-bottom: 1px solid #2a2b2e;
        padding: 9px 14px;
        font-size: 12.5px;
    }
    .search .results-panel a:hover { background: var(--sidebar-hover); }
    .search .results-panel a .search-keyword { color: var(--red) !important; font-weight: 700; }

    /* 사이드바 네비 */
    .sidebar-nav {
        padding: 6px 0 20px;
    }
    .sidebar-nav > ul > li {
        margin-bottom: 0;
    }

    /* 그룹 제목 (bold 항목) */
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
        font-size: 10px !important;
        font-weight: 700 !important;
        color: #4a4b50 !important;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        padding: 14px 16px 5px;
        margin: 0;
        display: block;
    }

    /* 일반 링크 */
    .sidebar-nav li a {
        color: #9a9ba0 !important;
        font-size: 13px;
        padding: 7px 16px;
        border-left: 2px solid transparent;
        display: block;
        line-height: 1.4;
        transition: all .15s;
    }
    .sidebar-nav li a:hover {
        color: #e0e0e0 !important;
        background: var(--sidebar-hover);
        text-decoration: none;
    }
    .sidebar-nav li.active > a {
        color: #fff !important;
        font-weight: 600;
        border-left-color: var(--red);
        background: rgba(232,0,26,.14);
    }

    /* 2depth 서브 링크 */
    .sidebar-nav ul ul li a {
        padding: 5px 16px 5px 28px !important;
        font-size: 12px !important;
        color: #5c5d63 !important;
    }
    .sidebar-nav ul ul li a:hover { color: #bbb !important; background: rgba(255,255,255,.04); }
    .sidebar-nav ul ul li.active > a { color: #fff !important; font-weight: 600; border-left-color: var(--red); background: rgba(232,0,26,.1); }

    /* 사이드바 아이콘 */
    .sidebar-nav .nav-icon {
        width: 18px;
        display: inline-flex;
        align-items: center;
        margin-right: 7px;
        font-size: 0.92em;
    }
    .icon-android { color: #3DDC84; }
    .icon-ios { color: #ccc; }
    .icon-web { color: #4A90D9; }
    .icon-google { color: #EA4335; }
    .icon-api { color: #F5A623; }
    .icon-partner { color: var(--red); }
    .icon-unity { color: #ccc; }

    /* 사이드바 스크롤바 */
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* ── 메인 콘텐츠 ── */
    .content { padding-top: 16px; }
    .markdown-section { max-width: 860px; padding-top: 24px; }

    /* 제목 */
    .markdown-section h1 {
        font-size: 26px;
        font-weight: 800;
        color: var(--dark);
        margin-bottom: 6px;
        line-height: 1.3;
        border-bottom: none;
        padding-bottom: 0;
    }
    .markdown-section h2 {
        font-size: 18px;
        font-weight: 700;
        color: var(--dark);
        margin: 32px 0 12px;
        padding-bottom: 7px;
        border-bottom: 2px solid var(--red);
    }
    .markdown-section h3 {
        font-size: 15.5px;
        font-weight: 700;
        color: var(--dark);
        margin: 20px 0 8px;
        border-bottom: none;
    }
    .markdown-section h4 {
        font-size: 14px;
        font-weight: 700;
        color: var(--dark);
        margin: 14px 0 6px;
    }

    /* 본문 */
    .markdown-section p { color: var(--text); font-size: 14px; line-height: 1.75; }

    /* 인라인 코드 */
    .markdown-section code {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        background: #f0f0f2;
        color: #c7254e;
        border: 1px solid #e5e5e5;
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 12.5px;
    }

    /* 코드 블록 */
    .markdown-section pre {
        background: #1e1e2e !important;
        border-radius: 8px;
        border-left: none;
        position: relative;
    }
    .markdown-section pre code {
        background: transparent;
        color: #d4d4d4;
        font-size: 12.5px;
        line-height: 1.65;
        border: none;
        padding: 0;
    }
    .markdown-section pre[data-lang]::before {
        content: attr(data-lang);
        position: absolute;
        top: 8px;
        right: 44px;
        font-size: 10px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: .6px;
        font-family: -apple-system, sans-serif;
    }

    /* 테이블 */
    .markdown-section table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13.5px;
        margin: 12px 0;
    }
    .markdown-section table thead tr {
        background-color: var(--red);
        color: #fff;
    }
    .markdown-section table thead th {
        padding: 8px 12px;
        font-weight: 600;
        font-size: 13px;
        border: none;
        color: #fff;
        background: transparent;
    }
    .markdown-section table tbody tr:nth-child(even) { background: var(--bg); }
    .markdown-section table tbody tr:hover td { background: rgba(232,0,26,.04); }
    .markdown-section table tbody td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 13.5px;
        vertical-align: top;
    }

    /* 링크 */
    .markdown-section a { color: var(--red); text-decoration: none; }
    .markdown-section a:hover { color: var(--red-mid); text-decoration: underline; }

    /* 인용 / 콜아웃 */
    .markdown-section blockquote {
        border-left: 3px solid var(--red);
        background: var(--red-light);
        padding: 11px 15px;
        border-radius: 0 6px 6px 0;
        margin: 12px 0;
    }
    .markdown-section blockquote p { margin: 0; font-size: 13.5px; }

    /* 수평선 */
    .markdown-section hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* 리스트 */
    .markdown-section ul li,
    .markdown-section ol li { line-height: 1.8; color: var(--text); font-size: 13.5px; }

    /* ── pagination ── */
    .pagination {
        border-top: none !important;
        margin-top: 48px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
    }
    .pagination-item { flex: 1; }
    .pagination-item--next { text-align: right; }
    .pagination-item a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--light) !important;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 13px;
        text-decoration: none !important;
        transition: all .15s;
        background: #fff;
    }
    .pagination-item a:hover {
        background: var(--red) !important;
        color: #fff !important;
        border-color: var(--red) !important;
    }

    /* ── copy-code 버튼 ── */
    .docsify-copy-code-button {
        background: #13131f !important;
        color: #888 !important;
        border-radius: 3px !important;
        font-size: 10.5px !important;
        border: none !important;
        opacity: 1 !important;
    }
    .docsify-copy-code-button:hover { background: rgba(255,255,255,.18) !important; color: #ddd !important; }
    .docsify-copy-code-button::after { content: '복사'; }
    .docsify-copy-code-button.success::after { content: '완료!'; }

    /* ── 사이드바 토글 ── */
    .sidebar-toggle { background: transparent; }
    .sidebar-toggle span { background: #666; }

    /* GitHub 코너 숨기기 */
    .github-corner { display: none !important; }

    /* ── 모바일 반응형 ── */
    @media screen and (max-width: 768px) {
        .pagination { flex-direction: column; }
        .pagination-item--next { text-align: left; }
    }
    </style>
  </head>
  <body>
    <div id="app"></div>div>
    <script>
      window.$docsify = {
          name: '<b style="color:#E8001A">nap</b><span style="color:#fff"> mx</span>',
          nameLink: '/',
          repo: '',
          homepage: 'overview.md',
          loadSidebar: true,
          coverpage: false,
          loadNavbar: true,
          auto2top: true,
          subMaxLevel: 3,
          maxLevel: 4,
          themeColor: '#E8001A',
          search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '검색...',
                noData: '검색 결과 없음',
                depth: 3
          },
          copyCode: {
                buttonText: ' ',
                errorText: '오류',
                successText: ' '
          },
          pagination: {
                previousText: '이전',
                nextText: '다음',
                crossChapter: true,
                crossChapterText: true
          }
      }
        </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-xml-doc.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/zoom-image.docsify/build/zoom-image.min.js"></script>
  </body>
</html>
    </script>
  </body>
  </style></title>
