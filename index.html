<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>nap mx Publisher Guide</title>
  <meta name="description" content="nap mx SDK 공식 연동 가이드">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="/_media/favicon.ico">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* =============================================
       nasmedia CI Color System
       Primary  : #ED1C24 (KT NasMedia Red)
       Black    : #000000
       D.Grey   : #6D6E70
       L.Grey   : #A7A9AB
       BG Light : #F8F8F8
    ============================================= */

    :root {
      --theme-color: #ED1C24;
      --color-primary:   #ED1C24;
      --color-black:     #000000;
      --color-dgrey:     #6D6E70;
      --color-lgrey:     #A7A9AB;
      --color-bg:        #F8F8F8;
      --color-white:     #FFFFFF;
      --color-red-light: #FFF0F0;
      --color-red-mid:   #C8151B;  /* hover: 10% darker */
    }

    /* ── 사이드바 ── */
    .sidebar {
      border-right: 1px solid #E8E8E8;
      background-color: var(--color-white);
    }
    .sidebar .app-name {
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sidebar .app-name a {
      color: var(--color-black) !important;
    }
    .sidebar-nav li a {
      color: var(--color-dgrey);
      font-size: 0.92rem;
      transition: color 0.15s;
    }
    .sidebar-nav li a:hover {
      color: var(--color-primary);
    }
    .sidebar-nav li.active > a,
    .sidebar-nav li a.active {
      color: var(--color-primary) !important;
      font-weight: 600;
      border-right: 3px solid var(--color-primary);
    }
    .sidebar-nav > ul > li > a {
      color: var(--color-black);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* ── 상단 네비바 ── */
    nav.app-nav {
      background: var(--color-white);
      border-bottom: 1px solid #E8E8E8;
    }
    nav.app-nav a {
      color: var(--color-dgrey);
      font-size: 0.9rem;
    }
    nav.app-nav a:hover,
    nav.app-nav a.active {
      color: var(--color-primary);
    }

    /* ── 메인 콘텐츠 ── */
    .content {
      padding-top: 20px;
    }
    .markdown-section {
      max-width: 860px;
    }

    /* 제목 */
    .markdown-section h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-black);
      border-bottom: 3px solid var(--color-primary);
      padding-bottom: 10px;
      margin-bottom: 24px;
    }
    .markdown-section h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--color-black);
      border-bottom: 1px solid #E8E8E8;
      padding-bottom: 6px;
      margin-top: 36px;
    }
    .markdown-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-dgrey);
      margin-top: 24px;
    }

    /* 인라인 코드 */
    .markdown-section code {
      background: var(--color-red-light);
      color: var(--color-primary);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.88em;
    }

    /* 코드 블록 */
    .markdown-section pre {
      background: #1A1A1A !important;
      border-radius: 6px;
      border-left: 4px solid var(--color-primary);
    }
    .markdown-section pre code {
      background: transparent;
      color: #F8F8F8;
      font-size: 0.87em;
    }

    /* 테이블 */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.92rem;
    }
    .markdown-section table thead tr {
      background-color: var(--color-primary);
      color: var(--color-white);
    }
    .markdown-section table thead th {
      padding: 10px 14px;
      font-weight: 600;
      text-align: left;
      border: none;
    }
    .markdown-section table tbody tr:nth-child(even) {
      background-color: var(--color-bg);
    }
    .markdown-section table tbody tr:hover {
      background-color: var(--color-red-light);
    }
    .markdown-section table tbody td {
      padding: 9px 14px;
      border-bottom: 1px solid #E8E8E8;
      color: var(--color-black);
    }

    /* 콜아웃: tip / warning / danger */
    .tip {
      border-left: 4px solid var(--color-primary);
      background: var(--color-red-light);
    }
    .warning {
      border-left: 4px solid #F5A623;
      background: #FFFBF0;
    }
    .danger {
      border-left: 4px solid #C8151B;
      background: #FFF0F0;
    }

    /* 인용 */
    .markdown-section blockquote {
      border-left: 4px solid var(--color-lgrey);
      background: var(--color-bg);
      color: var(--color-dgrey);
      margin: 16px 0;
      padding: 10px 16px;
      border-radius: 0 4px 4px 0;
    }
    .markdown-section blockquote p { margin: 0; }

    /* 링크 */
    .markdown-section a {
      color: var(--color-primary);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .markdown-section a:hover {
      color: var(--color-red-mid);
      border-bottom-color: var(--color-red-mid);
    }

    /* 수평선 */
    .markdown-section hr {
      border: none;
      border-top: 1px solid #E8E8E8;
      margin: 28px 0;
    }

    /* 검색창 */
    .search input {
      border: 1px solid #E8E8E8;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }
    .search input:focus {
      border-color: var(--color-primary);
      outline: none;
      box-shadow: 0 0 0 2px rgba(237,28,36,0.15);
    }
    .search .matching-post a:hover {
      color: var(--color-primary);
    }

    /* pagination 버튼 */
    .pagination-item a {
      color: var(--color-primary) !important;
      border: 1px solid var(--color-lgrey);
      border-radius: 4px;
      padding: 6px 14px;
      transition: background 0.15s;
    }
    .pagination-item a:hover {
      background: var(--color-primary) !important;
      color: var(--color-white) !important;
      border-color: var(--color-primary);
    }

    /* copy-code 버튼 */
    .docsify-copy-code-button {
      background: var(--color-primary) !important;
      color: var(--color-white) !important;
      border-radius: 3px;
      font-size: 0.75rem;
      opacity: 0.85;
    }
    .docsify-copy-code-button:hover { opacity: 1; }

    /* 버전 뱃지 */
    .version-badge {
      display: inline-block;
      background: var(--color-primary);
      color: var(--color-white);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.82em;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* 사이드바 토글 */
    .sidebar-toggle { background-color: transparent; }
    .sidebar-toggle span { background-color: var(--color-dgrey); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<b>nap mx</b> Guide',
      nameLink: '/',
      repo: 'https://github.com/napmx/napmx.github.io',
      homepage: 'overview.md',
      loadSidebar: true,
      coverpage: false,
      loadNavbar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      themeColor: '#ED1C24',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '검색...',
        noData: '검색 결과 없음',
        depth: 3
      },
      copyCode: {
        buttonText: '복사',
        errorText: '오류',
        successText: '완료'
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true,
        crossChapterText: true
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-xml-doc.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/zoom-image.docsify/build/zoom-image.min.js"></script>
</body>
</html>
